<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mandarin Offline Authenticator</title>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
    <style>
        :root {
            --bg-main: #0b0f19;
            --bg-card: #151c2c;
            --accent-cyan: #06b6d4;
            --accent-red: #ef4444;
            --accent-green: #10b981;
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.1);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        body { background: var(--bg-main); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px; gap: 15px; }
        .header { text-align: center; margin-top: 10px; }
        .header-title { font-size: 22px; font-weight: 800; color: var(--accent-cyan); }
        .card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 20px; padding: 20px; width: 100%; max-width: 360px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
        .scan-btn { background: linear-gradient(135deg, var(--accent-cyan), #0284c7); border: none; color: #fff; padding: 16px; border-radius: 14px; font-size: 16px; font-weight: 800; width: 100%; cursor: pointer; }
        .video-wrapper { position: relative; width: 100%; height: 260px; background: #000; border-radius: 14px; overflow: hidden; border: 2px solid var(--accent-cyan); display: none; }
        .video-wrapper video { width: 100%; height: 100%; object-fit: cover; }
        .scan-corner { position: absolute; width: 40px; height: 40px; border-color: var(--accent-cyan); border-style: solid; }
        .scan-corner.tl { top: 20px; left: 20px; border-width: 3px 0 0 3px; }
        .scan-corner.tr { top: 20px; right: 20px; border-width: 3px 3px 0 0; }
        .scan-corner.bl { bottom: 20px; left: 20px; border-width: 0 0 3px 3px; }
        .scan-corner.br { bottom: 20px; right: 20px; border-width: 0 3px 3px 0; }
        .result-box { background: rgba(0,0,0,0.5); border: 2px solid var(--accent-cyan); border-radius: 14px; padding: 18px; width: 100%; text-align: center; }
        .result-box.stop-mode { border-color: var(--accent-red); }
        .code-label { font-size: 10px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
        .code-display { font-family: 'Courier New', monospace; font-size: 42px; font-weight: 900; letter-spacing: 5px; color: var(--accent-cyan); }
        .code-display.stop-mode { color: var(--accent-red); }
        .status-msg { font-size: 12px; color: var(--text-dim); margin-top: 6px; }
        .log-box { background: rgba(0,0,0,0.7); border: 1px solid var(--border-color); border-radius: 10px; padding: 10px; width: 100%; max-width: 360px; font-size: 10px; color: #06b6d4; font-family: monospace; max-height: 120px; overflow-y: auto; }
    </style>
</head>
<body>

    <div class="header">
        <div class="header-title">🍊 MANDARIN AUTH</div>
        <div style="font-size:11px; color:var(--text-dim); margin-top:4px;">QR CODE AUTHENTICATOR</div>
    </div>

    <div class="card">
        <button id="btnScan" class="scan-btn" onclick="startLiveCamera()">📷 Open Scanner</button>

        <div id="videoWrapper" class="video-wrapper">
            <video id="webcamVideo" playsinline webkit-playsinline autoplay muted></video>
            <canvas id="scanCanvas" style="display:none;"></canvas>
            <div class="scan-corner tl"></div>
            <div class="scan-corner tr"></div>
            <div class="scan-corner bl"></div>
            <div class="scan-corner br"></div>
        </div>

        <div class="result-box" id="resultBox">
            <div class="code-label" id="codeLabel">Alphanumeric Response PIN</div>
            <div class="code-display" id="codeDisplay">------</div>
            <div class="status-msg" id="statusMsg">Tap "Open Scanner" to begin.</div>
        </div>
    </div>

    <div class="log-box" id="logBox">▶ System Ready<br></div>

    <script>
        const SECRET_KEY = "MANDARIN_AIRGAPPED_MASTER_SECRET_2026";
        let mediaStream = null;
        let scanInterval = null;
        let frameCount = 0;
        let engineReady = false;

        function log(msg) {
            const lb = document.getElementById('logBox');
            lb.innerHTML += msg + '<br>';
            lb.scrollTop = lb.scrollHeight;
        }

        // Check engine on load
        window.addEventListener('load', function() {
            if (typeof jsQR === 'function') {
                engineReady = true;
                log('✅ jsQR engine loaded OK');
            } else {
                log('❌ jsQR engine FAILED to load');
            }
        });

        function generateAlphanumericCode(key, message) {
            let hash = 0;
            const combined = key + ":" + message;
            for (let i = 0; i < combined.length; i++) {
                hash = ((hash << 5) - hash) + combined.charCodeAt(i);
                hash |= 0;
            }
            let val = Math.abs(hash);
            const charset = "0123456789ABCDEFGHJKLMNPQRSTUVWXYZ";
            let code = "";
            for (let i = 0; i < 6; i++) {
                code += charset[val % charset.length];
                val = Math.floor(val / charset.length) + (i + 1) * 7;
            }
            return code;
        }

        function startLiveCamera() {
            document.getElementById('btnScan').style.display = 'none';
            document.getElementById('videoWrapper').style.display = 'block';
            document.getElementById('statusMsg').innerText = 'Point camera at QR code on PC screen...';

            if (!engineReady) {
                log('⚠️ jsQR not ready, checking again...');
                engineReady = (typeof jsQR === 'function');
                if (!engineReady) {
                    log('❌ jsQR still not available. CDN may be blocked.');
                    document.getElementById('statusMsg').innerHTML = '<span style="color:red">Scanner engine failed to load. Check internet connection.</span>';
                    document.getElementById('btnScan').style.display = 'block';
                    document.getElementById('videoWrapper').style.display = 'none';
                    return;
                }
            }
            log('▶ Opening camera...');

            navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
                .catch(() => navigator.mediaDevices.getUserMedia({ video: true }))
                .then(function(stream) {
                    mediaStream = stream;
                    const video = document.getElementById('webcamVideo');
                    video.srcObject = stream;
                    video.play();
                    frameCount = 0;
                    log('✅ Camera started');
                    scanInterval = setInterval(processFrame, 100);
                })
                .catch(function(err) {
                    log('❌ Camera error: ' + err.message);
                    document.getElementById('statusMsg').innerHTML = '<span style="color:red">Camera error: ' + err.message + '</span>';
                    document.getElementById('btnScan').style.display = 'block';
                    document.getElementById('videoWrapper').style.display = 'none';
                });
        }

        function processFrame() {
            const video = document.getElementById('webcamVideo');
            const canvas = document.getElementById('scanCanvas');
            if (!video || video.readyState !== video.HAVE_ENOUGH_DATA) return;
            if (!video.videoWidth) return;

            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0);
            const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);

            frameCount++;
            if (frameCount % 20 === 0) log('📹 Frame ' + frameCount + ' (' + canvas.width + 'x' + canvas.height + ')');

            const result = jsQR(imgData.data, imgData.width, imgData.height, { inversionAttempts: "attemptBoth" });
            if (result && result.data) {
                log('🎯 QR RAW: ' + result.data);
                stopCamera();
                handleQR(result.data);
            }
        }

        function stopCamera() {
            clearInterval(scanInterval); scanInterval = null;
            if (mediaStream) { mediaStream.getTracks().forEach(t => t.stop()); mediaStream = null; }
            document.getElementById('videoWrapper').style.display = 'none';
        }

        function handleQR(payload) {
            const parts = payload.split(':');
            let mode = 'DEV';
            let windowTime = Math.floor(Date.now() / 1000 / 30);

            for (let i = 0; i < parts.length; i++) {
                if (parts[i] === 'DEV' || parts[i] === 'STOP') {
                    mode = parts[i];
                    if (parts[i+1] && !isNaN(parts[i+1])) windowTime = parseInt(parts[i+1]);
                    break;
                }
            }

            log('🔑 Mode: ' + mode + ' | Window: ' + windowTime);

            const code = generateAlphanumericCode(SECRET_KEY, mode + ":" + windowTime);
            const fmt = code.substring(0, 3) + '-' + code.substring(3);

            document.getElementById('codeDisplay').innerText = fmt;
            document.getElementById('codeLabel').innerText = mode === 'DEV' ? 'Developer Unlock PIN' : 'Server Shutdown PIN';
            document.getElementById('resultBox').className = 'result-box' + (mode === 'STOP' ? ' stop-mode' : '');
            document.getElementById('codeDisplay').className = 'code-display' + (mode === 'STOP' ? ' stop-mode' : '');
            document.getElementById('statusMsg').innerHTML = '<span style="color:var(--accent-green); font-weight:800;">✔ Enter this PIN into PC!</span>';
            log('✅ Generated PIN: ' + fmt);

            const btn = document.getElementById('btnScan');
            btn.style.display = 'block';
            btn.innerText = '📷 Scan Again';
        }
    </script>
</body>
</html>
