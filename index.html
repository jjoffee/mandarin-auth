<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#060a14">
    <title>Mandarin Authenticator • 2FA</title>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
            user-select: none;
        }

        :root {
            --bg: #060a14;
            --mandarin-orange: #ff7a00;
            --mandarin-glow: rgba(255, 122, 0, 0.35);
            --cyan: #00d4ff;
            --cyan-glow: rgba(0, 212, 255, 0.35);
            --green: #00e5a0;
            --green-glow: rgba(0, 229, 160, 0.3);
            --red: #ff4757;
            --red-glow: rgba(255, 71, 87, 0.35);
            --text-main: #f0f6ff;
            --text-dim: #8b9bb4;
            --text-muted: #485672;
            --glass-bg: rgba(13, 20, 38, 0.65);
            --glass-card: rgba(18, 27, 49, 0.7);
            --glass-border: rgba(255, 255, 255, 0.12);
            --safe-top: env(safe-area-inset-top, 12px);
            --safe-bottom: env(safe-area-inset-bottom, 12px);
        }

        html, body {
            width: 100%;
            height: 100vh;
            height: 100dvh;
            max-height: 100dvh;
            background: var(--bg);
            color: var(--text-main);
            overflow: hidden; /* Zero scroll */
            position: fixed;
            inset: 0;
        }

        body {
            display: flex;
            flex-direction: column;
            padding-top: var(--safe-top);
            padding-bottom: var(--safe-bottom);
        }

        /* ── Ambient Glowing Glass Blobs ── */
        .ambient-glow {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        .glow-orb-1 {
            position: absolute;
            top: -10%;
            left: 5%;
            width: 280px;
            height: 280px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 122, 0, 0.18) 0%, rgba(255, 122, 0, 0) 70%);
            filter: blur(50px);
        }
        .glow-orb-2 {
            position: absolute;
            bottom: -5%;
            right: 0%;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0, 212, 255, 0.16) 0%, rgba(0, 212, 255, 0) 70%);
            filter: blur(50px);
        }

        .page-content {
            position: relative;
            z-index: 1;
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 8px 12px;
            gap: 8px;
            max-width: 440px;
            margin: 0 auto;
            width: 100%;
            height: 100%;
            max-height: 100%;
            overflow: hidden;
        }

        /* ── Glass Header ── */
        .app-header {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--glass-bg);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 8px 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            flex-shrink: 0;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .brand-icon {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, #ff7a00, #ff4757);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 17px;
            box-shadow: 0 2px 10px var(--mandarin-glow);
            border: 1px solid rgba(255, 255, 255, 0.25);
            position: relative;
            overflow: hidden;
        }

        .brand-icon::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 50%;
            background: linear-gradient(180deg, rgba(255,255,255,0.35) 0%, transparent 100%);
            border-radius: 10px 10px 0 0;
        }

        .brand-text {
            display: flex;
            flex-direction: column;
        }

        .brand-name {
            font-size: 13.5px;
            font-weight: 900;
            color: #fff;
            letter-spacing: 0.6px;
            background: linear-gradient(135deg, #fff 40%, #ff9f43 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1.1;
        }

        .brand-sub {
            font-size: 8.5px;
            color: var(--text-dim);
            letter-spacing: 1px;
            text-transform: uppercase;
            font-weight: 700;
        }

        .status-pill {
            display: flex;
            align-items: center;
            gap: 5px;
            background: rgba(0, 229, 160, 0.12);
            border: 1px solid rgba(0, 229, 160, 0.3);
            border-radius: 20px;
            padding: 4px 9px;
            font-size: 9.5px;
            font-weight: 800;
            color: var(--green);
            letter-spacing: 0.5px;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--green);
            box-shadow: 0 0 6px var(--green);
            animation: blink 2s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(0.85); }
        }

        /* ── Glassmorphism Scan Card ── */
        .scan-card {
            width: 100%;
            background: var(--glass-card);
            backdrop-filter: blur(24px) saturate(190%);
            -webkit-backdrop-filter: blur(24px) saturate(190%);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.15);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-shrink: 1;
            min-height: 0;
            position: relative;
        }

        /* ── Square Video Section with Expansion Animation ── */
        .video-section {
            position: relative;
            width: 100%;
            max-width: 250px;
            aspect-ratio: 1 / 1; /* PERFECT SQUARE SCANNER */
            background: #000;
            display: none;
            overflow: hidden;
            border-radius: 20px;
            margin: 8px auto;
            box-shadow: 0 0 24px rgba(0, 212, 255, 0.25), inset 0 0 20px rgba(0,0,0,0.8);
            border: 2px solid rgba(0, 212, 255, 0.35);
        }

        @keyframes scannerExpand {
            0% {
                transform: scale(0.25) rotate(-4deg);
                opacity: 0;
                filter: blur(12px);
                clip-path: circle(10% at 50% 50%);
            }
            65% {
                transform: scale(1.04) rotate(0deg);
                opacity: 1;
                filter: blur(0px);
                clip-path: circle(75% at 50% 50%);
            }
            100% {
                transform: scale(1) rotate(0deg);
                opacity: 1;
                clip-path: circle(100% at 50% 50%);
            }
        }

        .video-section.active {
            display: block;
            animation: scannerExpand 0.45s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        #webcamVideo {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Square Viewfinder Overlay */
        .vf-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }

        .vf-frame {
            position: relative;
            width: 72%;
            aspect-ratio: 1 / 1; /* SQUARE FRAME */
            animation: cornerExpand 0.4s 0.1s cubic-bezier(0.34, 1.56, 0.64, 1) both;
        }

        @keyframes cornerExpand {
            0% { transform: scale(0.6); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .vf-corner {
            position: absolute;
            width: 24px;
            height: 24px;
            border-color: var(--cyan);
            border-style: solid;
            filter: drop-shadow(0 0 6px var(--cyan));
        }

        .vf-corner.tl { top: 0; left: 0; border-width: 3.5px 0 0 3.5px; border-radius: 6px 0 0 0; }
        .vf-corner.tr { top: 0; right: 0; border-width: 3.5px 3.5px 0 0; border-radius: 0 6px 0 0; }
        .vf-corner.bl { bottom: 0; left: 0; border-width: 0 0 3.5px 3.5px; border-radius: 0 0 0 6px; }
        .vf-corner.br { bottom: 0; right: 0; border-width: 0 3.5px 3.5px 0; border-radius: 0 0 6px 0; }

        .vf-scan-line {
            position: absolute;
            left: 4px;
            right: 4px;
            height: 2.5px;
            background: linear-gradient(90deg, transparent, #ff7a00, #00d4ff, transparent);
            box-shadow: 0 0 12px #00d4ff, 0 0 6px #ff7a00;
            animation: scanLineAnim 1.8s infinite ease-in-out;
            top: 0;
        }

        @keyframes scanLineAnim {
            0% { top: 4px; opacity: 1; }
            90% { top: calc(100% - 4px); opacity: 1; }
            100% { top: calc(100% - 4px); opacity: 0; }
        }

        .vf-bg {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.45);
        }

        .live-badge {
            position: absolute;
            top: 8px;
            left: 8px;
            display: flex;
            align-items: center;
            gap: 5px;
            background: rgba(0,0,0,0.65);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 20px;
            padding: 3px 8px;
            font-size: 8.5px;
            font-weight: 800;
            color: var(--red);
            letter-spacing: 0.5px;
        }

        .frame-badge {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(0,0,0,0.65);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 8px;
            padding: 3px 7px;
            font-size: 8.5px;
            font-family: 'SF Mono', monospace;
            color: var(--cyan);
            font-weight: 700;
        }

        .btn-close-cam {
            position: absolute;
            bottom: 8px;
            right: 8px;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: rgba(0,0,0,0.7);
            border: 1px solid rgba(255,255,255,0.2);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            cursor: pointer;
            backdrop-filter: blur(6px);
        }

        /* ── Idle State ── */
        .idle-section {
            padding: 16px 16px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .idle-icon-wrap {
            width: 54px;
            height: 54px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 122, 0, 0.25) 0%, rgba(0, 212, 255, 0.1) 100%);
            border: 1px solid rgba(255, 122, 0, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            box-shadow: 0 0 16px var(--mandarin-glow);
            animation: idlePulse 3s infinite ease-in-out;
        }

        @keyframes idlePulse {
            0%, 100% { transform: scale(1); box-shadow: 0 0 12px var(--mandarin-glow); }
            50% { transform: scale(1.04); box-shadow: 0 0 22px var(--mandarin-glow); }
        }

        .idle-text {
            text-align: center;
        }

        .idle-title {
            font-size: 14.5px;
            font-weight: 800;
            color: #fff;
            margin-bottom: 2px;
            letter-spacing: 0.2px;
        }

        .idle-subtitle {
            font-size: 11px;
            color: var(--text-dim);
            line-height: 1.3;
        }

        /* ── Action Scan Button ── */
        .scan-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: calc(100% - 24px);
            margin: 0 12px 12px;
            padding: 11px;
            background: linear-gradient(135deg, #ff7a00 0%, #ff4757 50%, #0077ff 100%);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 14px;
            color: #fff;
            font-size: 14px;
            font-weight: 800;
            letter-spacing: 0.4px;
            cursor: pointer;
            box-shadow: 0 6px 20px var(--mandarin-glow);
            transition: all 0.2s;
            position: relative;
            overflow: hidden;
            flex-shrink: 0;
        }

        .scan-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 50%;
            background: linear-gradient(180deg, rgba(255,255,255,0.25) 0%, transparent 100%);
            border-radius: 14px 14px 0 0;
        }

        .scan-btn:active {
            transform: scale(0.97);
        }

        .scan-btn.hidden { display: none; }

        /* ── Glassmorphism Result Card ── */
        .result-card {
            width: 100%;
            background: var(--glass-card);
            backdrop-filter: blur(24px) saturate(190%);
            -webkit-backdrop-filter: blur(24px) saturate(190%);
            border: 1px solid var(--glass-border);
            border-radius: 22px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.15);
            flex-shrink: 0;
        }

        .result-inner {
            padding: 12px 14px;
            text-align: center;
        }

        .result-label {
            font-size: 9.5px;
            font-weight: 800;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            color: var(--text-dim);
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }

        .code-wrap {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin-bottom: 6px;
        }

        .code-group {
            font-family: 'SF Mono', monospace;
            font-size: 28px;
            font-weight: 900;
            letter-spacing: 3px;
            color: var(--cyan);
            background: rgba(0, 212, 255, 0.08);
            border: 1px solid rgba(0, 212, 255, 0.3);
            border-radius: 12px;
            padding: 5px 12px;
            min-width: 86px;
            box-shadow: 0 4px 16px rgba(0, 212, 255, 0.12), inset 0 1px 0 rgba(255,255,255,0.15);
            transition: all 0.3s;
        }

        .code-sep {
            font-size: 20px;
            font-weight: 300;
            color: var(--text-muted);
        }

        .code-group.stop-mode {
            color: var(--red);
            background: rgba(255, 71, 87, 0.08);
            border-color: rgba(255, 71, 87, 0.3);
            box-shadow: 0 4px 16px rgba(255, 71, 87, 0.2);
        }

        /* ── Dynamic Live Timer (No Percentages) ── */
        .mobile-timer-box {
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 7px 12px;
            margin: 6px 0 4px;
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.3);
        }

        .timer-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 5px;
            font-size: 9.5px;
            font-weight: 700;
        }

        .timer-title {
            color: var(--text-dim);
            display: flex;
            align-items: center;
            gap: 5px;
            letter-spacing: 0.3px;
        }

        .timer-badge {
            font-family: 'SF Mono', monospace;
            font-size: 11.5px;
            font-weight: 900;
            color: var(--cyan);
            background: rgba(0, 212, 255, 0.12);
            border: 1px solid rgba(0, 212, 255, 0.3);
            padding: 2px 6px;
            border-radius: 6px;
        }

        .timer-bar-track {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 20px;
            overflow: hidden;
            padding: 1px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .timer-bar-fill {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #ff7a00, #00d4ff);
            border-radius: 20px;
            transition: width 0.3s linear;
            box-shadow: 0 0 8px rgba(0, 212, 255, 0.5);
        }

        .result-status {
            font-size: 11px;
            color: var(--text-dim);
            line-height: 1.3;
            margin-top: 3px;
        }

        .result-status.success {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            color: var(--green);
            font-weight: 700;
        }

        /* ── Copy Button ── */
        .copy-btn {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--glass-border);
            color: #fff;
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 10px;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            margin-top: 4px;
        }

        .copy-btn:active {
            background: rgba(255, 255, 255, 0.15);
            transform: scale(0.96);
        }

        /* ── Compact Glass Flow Steps Bar (Zero Scroll) ── */
        .flow-bar {
            width: 100%;
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 14px;
            padding: 5px 10px;
            display: flex;
            align-items: center;
            justify-content: space-around;
            box-shadow: 0 4px 16px rgba(0,0,0,0.25);
            flex-shrink: 0;
        }

        .flow-step {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 9.5px;
            color: var(--text-dim);
            font-weight: 600;
        }

        .flow-num {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: rgba(0, 212, 255, 0.15);
            color: var(--cyan);
            font-size: 9px;
            font-weight: 900;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .flow-arrow {
            color: var(--text-muted);
            font-size: 8px;
        }

        /* Animation */
        @keyframes successPop {
            0% { transform: scale(0.88); opacity: 0; }
            60% { transform: scale(1.04); }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-pop { animation: successPop 0.3s ease forwards; }

        canvas { display: none; }
    </style>
</head>
<body>

<div class="ambient-glow">
    <div class="glow-orb-1"></div>
    <div class="glow-orb-2"></div>
</div>

<div class="page-content">

    <!-- Glass Header -->
    <header class="app-header">
        <div class="brand">
            <div class="brand-icon">🍊</div>
            <div class="brand-text">
                <div class="brand-name">MANDARIN</div>
                <div class="brand-sub">AUTHENTICATOR</div>
            </div>
        </div>
        <div class="status-pill">
            <div class="status-dot"></div>
            AIR-GAPPED
        </div>
    </header>

    <!-- Glass Scan Card -->
    <div class="scan-card" id="scanCard">

        <!-- Square Live Camera Viewfinder with Expansion Animation -->
        <div class="video-section" id="videoSection">
            <video id="webcamVideo" playsinline webkit-playsinline autoplay muted></video>
            <canvas id="scanCanvas"></canvas>

            <div class="vf-bg"></div>
            <div class="vf-overlay">
                <div class="vf-frame">
                    <div class="vf-scan-line"></div>
                    <div class="vf-corner tl"></div>
                    <div class="vf-corner tr"></div>
                    <div class="vf-corner bl"></div>
                    <div class="vf-corner br"></div>
                </div>
            </div>

            <div class="live-badge">
                <div class="status-dot" style="background: var(--red); box-shadow: 0 0 6px var(--red);"></div>
                LIVE
            </div>
            <div class="frame-badge" id="frameBadge">0 fps</div>
            <div class="btn-close-cam" onclick="resetToIdle()"><i class="fa-solid fa-xmark"></i></div>
        </div>

        <!-- Idle State -->
        <div class="idle-section" id="idleSection">
            <div class="idle-icon-wrap">📷</div>
            <div class="idle-text">
                <div class="idle-title">Scan Challenge QR</div>
                <div class="idle-subtitle">Aim camera at PC screen code</div>
            </div>
        </div>

        <!-- Scan Button -->
        <button class="scan-btn" id="btnScan" onclick="startLiveCamera()">
            <span>📷</span>
            <span id="btnText">Open Scanner</span>
        </button>
    </div>

    <!-- Glass Result Card -->
    <div class="result-card">
        <div class="result-inner">
            <div class="result-label" id="resultLabel">
                <i class="fa-solid fa-shield-halved" style="color: var(--cyan);"></i>
                <span>Response PIN</span>
            </div>
            
            <div class="code-wrap">
                <div class="code-group" id="codeA">---</div>
                <div class="code-sep">-</div>
                <div class="code-group" id="codeB">---</div>
            </div>

            <!-- Dynamic Live Expiration Time Bar (No percentages) -->
            <div id="mobileCountdownWrap" class="mobile-timer-box" style="display: none;">
                <div class="timer-header-row">
                    <div class="timer-title">
                        <span>⏱️</span>
                        <span id="mobileTimerTitle">CODE VALID FOR</span>
                    </div>
                    <div id="mobileTimerVal" class="timer-badge">60s</div>
                </div>

                <div class="timer-bar-track">
                    <div id="mobileTimerBar" class="timer-bar-fill"></div>
                </div>
            </div>

            <div class="result-status" id="resultStatus">Awaiting scan…</div>

            <button id="btnCopyCode" class="copy-btn" style="display: none;" onclick="copyPinCode()">
                <i class="fa-regular fa-copy"></i>
                <span id="copyBtnText">Copy PIN</span>
            </button>
        </div>
    </div>

    <!-- Compact Glass Workflow Bar -->
    <div class="flow-bar">
        <div class="flow-step">
            <div class="flow-num">1</div>
            <span>Scan</span>
        </div>
        <div class="flow-arrow"><i class="fa-solid fa-chevron-right"></i></div>
        <div class="flow-step">
            <div class="flow-num">2</div>
            <span>Get PIN</span>
        </div>
        <div class="flow-arrow"><i class="fa-solid fa-chevron-right"></i></div>
        <div class="flow-step">
            <div class="flow-num">3</div>
            <span>Enter on PC</span>
        </div>
    </div>

</div>

<script>
    const SECRET_KEY = "MANDARIN_AIRGAPPED_MASTER_SECRET_2026";
    let mediaStream = null;
    let scanInterval = null;
    let frameCount = 0;
    let lastFrameTime = Date.now();
    let mobileTimerInterval = null;
    let currentGeneratedCode = '';

    function playBeepSound() {
        try {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(880, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
        } catch(e) {}
    }

    function generateAlphanumericCode(key, message) {
        const combined = key + ":" + message;
        const charset = "0123456789ABCDEFGHJKLMNPQRSTUVWXYZ";
        let h1 = 5381, h2 = 5381;
        for (let i = 0; i < combined.length; i++) {
            const c = combined.charCodeAt(i);
            h1 = ((h1 << 5) + h1) ^ c; h1 |= 0;
            h2 = ((h2 << 5) + h2) ^ (c * 31 | 0); h2 |= 0;
        }
        let v1 = Math.abs(h1), v2 = Math.abs(h2);
        let code = "";
        for (let i = 0; i < 3; i++) { code += charset[v1 % 34]; v1 = Math.floor(v1 / 34); }
        for (let i = 0; i < 3; i++) { code += charset[v2 % 34]; v2 = Math.floor(v2 / 34); }
        return code;
    }

    function startLiveCamera() {
        document.getElementById('btnScan').classList.add('hidden');
        document.getElementById('idleSection').style.display = 'none';
        
        const vidSec = document.getElementById('videoSection');
        vidSec.classList.remove('active');
        void vidSec.offsetWidth; // Trigger reflow for animation
        vidSec.classList.add('active');

        document.getElementById('resultStatus').textContent = 'Scanning…';

        if (typeof jsQR !== 'function') {
            resetToIdle();
            return;
        }

        navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
            .catch(() => navigator.mediaDevices.getUserMedia({ video: true }))
            .then(function(stream) {
                mediaStream = stream;
                const video = document.getElementById('webcamVideo');
                video.srcObject = stream;
                video.play();
                frameCount = 0;
                lastFrameTime = Date.now();
                scanInterval = setInterval(processFrame, 80);
            })
            .catch(function(err) {
                resetToIdle();
            });
    }

    function processFrame() {
        const video = document.getElementById('webcamVideo');
        const canvas = document.getElementById('scanCanvas');
        if (!video || video.readyState !== video.HAVE_ENOUGH_DATA || !video.videoWidth) return;

        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0);
        const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);

        frameCount++;
        const now = Date.now();
        if (now - lastFrameTime >= 1000) {
            document.getElementById('frameBadge').textContent = frameCount + ' fps';
            lastFrameTime = now;
        }

        const result = jsQR(imgData.data, imgData.width, imgData.height, { inversionAttempts: "attemptBoth" });
        if (result && result.data) {
            stopCamera();
            if (navigator.vibrate) navigator.vibrate([30, 40, 30]);
            playBeepSound();
            handleQR(result.data);
        }
    }

    function stopCamera() {
        if (scanInterval) { clearInterval(scanInterval); scanInterval = null; }
        if (mediaStream) { mediaStream.getTracks().forEach(t => t.stop()); mediaStream = null; }
        document.getElementById('videoSection').classList.remove('active');
    }

    function resetToIdle() {
        stopCamera();
        document.getElementById('idleSection').style.display = 'flex';
        const btn = document.getElementById('btnScan');
        btn.classList.remove('hidden');
        document.getElementById('btnText').textContent = 'Open Scanner';
    }

    function handleQR(payload) {
        const parts = payload.split(':');
        let mode = 'DEV';
        let windowTime = Math.floor(Date.now() / 1000 / 60);
        let expiresAt = null;
        let windowDuration = 60;

        for (let i = 0; i < parts.length; i++) {
            if (parts[i] === 'DEV' || parts[i] === 'STOP') {
                mode = parts[i];
                if (parts[i+1] && !isNaN(parts[i+1])) windowTime = parseInt(parts[i+1]);
                if (parts[i+2] && !isNaN(parts[i+2])) expiresAt = parseInt(parts[i+2]);
                if (parts[i+3] && !isNaN(parts[i+3])) windowDuration = parseInt(parts[i+3]);
                break;
            }
        }

        const code = generateAlphanumericCode(SECRET_KEY, mode + ":" + windowTime);
        currentGeneratedCode = code;
        const isStop = mode === 'STOP';

        const codeA = document.getElementById('codeA');
        const codeB = document.getElementById('codeB');
        codeA.textContent = code.substring(0, 3);
        codeB.textContent = code.substring(3);
        codeA.className = 'code-group animate-pop' + (isStop ? ' stop-mode' : '');
        codeB.className = 'code-group animate-pop' + (isStop ? ' stop-mode' : '');

        const label = document.getElementById('resultLabel');
        label.innerHTML = isStop 
            ? '<i class="fa-solid fa-triangle-exclamation" style="color: var(--red);"></i><span style="color: var(--red);">Shutdown PIN</span>' 
            : '<i class="fa-solid fa-shield-halved" style="color: var(--cyan);"></i><span>Developer PIN</span>';

        const status = document.getElementById('resultStatus');
        status.className = 'result-status success';
        status.innerHTML = '<span>✅</span><span>Enter PIN on PC</span>';

        const copyBtn = document.getElementById('btnCopyCode');
        if (copyBtn) copyBtn.style.display = 'inline-flex';

        // Start mobile countdown timer with remaining time
        startMobileTimer(expiresAt, windowTime, windowDuration, isStop);

        // Reset scan button
        document.getElementById('idleSection').style.display = 'flex';
        const btn = document.getElementById('btnScan');
        btn.classList.remove('hidden');
        document.getElementById('btnText').textContent = 'Scan Again';
    }

    function startMobileTimer(expiresAt, windowTime, windowDuration, isStop) {
        if (mobileTimerInterval) clearInterval(mobileTimerInterval);
        const wrap = document.getElementById('mobileCountdownWrap');
        const val = document.getElementById('mobileTimerVal');
        const bar = document.getElementById('mobileTimerBar');
        const title = document.getElementById('mobileTimerTitle');
        if (!wrap || !val || !bar) return;

        wrap.style.display = 'block';
        wrap.className = 'mobile-timer-box animate-pop';
        
        if (title) title.textContent = 'CODE VALID FOR';

        const targetExpirySecs = expiresAt || ((windowTime + 1) * windowDuration);

        function updateTick() {
            const nowSecs = Math.floor(Date.now() / 1000);
            const remaining = Math.max(0, targetExpirySecs - nowSecs);
            const pct = Math.max(0, Math.min(100, (remaining / windowDuration) * 100));

            val.textContent = remaining + 's';
            bar.style.width = pct + '%';

            if (isStop) {
                val.style.color = 'var(--red)';
                bar.style.background = remaining <= 10
                    ? 'linear-gradient(90deg, #b91c1c, #7f1d1d)'
                    : 'linear-gradient(90deg, #ff4757, #ff6b81)';
            } else {
                val.style.color = remaining <= 10 ? 'var(--red)' : 'var(--cyan)';
                bar.style.background = remaining <= 10
                    ? 'linear-gradient(90deg, #ef4444, #dc2626)'
                    : 'linear-gradient(90deg, #ff7a00, #00d4ff)';
            }

            if (remaining <= 0) {
                clearInterval(mobileTimerInterval);
                mobileTimerInterval = null;
                val.textContent = 'EXPIRED';
                val.style.color = 'var(--red)';
                bar.style.width = '0%';
                if (title) title.textContent = 'CODE EXPIRED';
                const status = document.getElementById('resultStatus');
                if (status) {
                    status.className = 'result-status';
                    status.innerHTML = '<span style="color: var(--red); font-weight: 700;">⚠️ Code expired — scan new QR</span>';
                }
            }
        }

        updateTick();
        mobileTimerInterval = setInterval(updateTick, 1000);
    }

    function copyPinCode() {
        if (!currentGeneratedCode) return;
        navigator.clipboard.writeText(currentGeneratedCode).then(() => {
            const btnText = document.getElementById('copyBtnText');
            if (btnText) {
                btnText.textContent = 'Copied! ✓';
                setTimeout(() => { btnText.textContent = 'Copy PIN'; }, 2000);
            }
        });
    }
</script>
</body>
</html>
