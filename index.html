<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Mandarin Auth</title>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif;
        }

        :root {
            --bg: #060a14;
            --surface: #0d1425;
            --surface2: #121a30;
            --cyan: #00d4ff;
            --cyan-dim: rgba(0, 212, 255, 0.15);
            --cyan-glow: rgba(0, 212, 255, 0.3);
            --green: #00e5a0;
            --green-dim: rgba(0, 229, 160, 0.12);
            --red: #ff4757;
            --red-dim: rgba(255, 71, 87, 0.12);
            --text: #f0f6ff;
            --text-dim: #6b7fa3;
            --text-muted: #3a4a6b;
            --border: rgba(255,255,255,0.06);
            --safe-top: env(safe-area-inset-top, 20px);
            --safe-bottom: env(safe-area-inset-bottom, 20px);
        }

        html, body {
            width: 100%;
            min-height: 100vh;
            min-height: 100dvh;
            background: var(--bg);
            color: var(--text);
            overflow-x: hidden;
        }

        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            min-height: 100dvh;
            padding-top: var(--safe-top);
            padding-bottom: var(--safe-bottom);
        }

        /* ── Ambient background ── */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 60% 40% at 20% 0%, rgba(0,212,255,0.07) 0%, transparent 60%),
                radial-gradient(ellipse 50% 35% at 80% 100%, rgba(0,229,160,0.05) 0%, transparent 60%);
            pointer-events: none;
            z-index: 0;
        }

        .page-content {
            position: relative;
            z-index: 1;
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 16px 16px 24px;
            gap: 16px;
            max-width: 480px;
            margin: 0 auto;
            width: 100%;
        }

        /* ── Header ── */
        .app-header {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 4px 0;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-icon {
            width: 38px;
            height: 38px;
            background: linear-gradient(135deg, var(--cyan), #0077ff);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            box-shadow: 0 4px 14px rgba(0,212,255,0.3);
        }

        .brand-text {
            display: flex;
            flex-direction: column;
        }

        .brand-name {
            font-size: 15px;
            font-weight: 800;
            color: var(--text);
            letter-spacing: 0.5px;
        }

        .brand-sub {
            font-size: 10px;
            color: var(--text-dim);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .status-pill {
            display: flex;
            align-items: center;
            gap: 5px;
            background: var(--green-dim);
            border: 1px solid rgba(0,229,160,0.2);
            border-radius: 20px;
            padding: 5px 10px;
            font-size: 10px;
            font-weight: 700;
            color: var(--green);
            letter-spacing: 0.5px;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--green);
            animation: blink 2s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        /* ── Scan card ── */
        .scan-card {
            width: 100%;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        }

        /* ── Video area ── */
        .video-section {
            position: relative;
            width: 100%;
            aspect-ratio: 1 / 1;
            background: #000;
            display: none;
        }

        .video-section.active {
            display: block;
        }

        #webcamVideo {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Corners viewfinder */
        .vf-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .vf-frame {
            position: relative;
            width: 65%;
            aspect-ratio: 1;
        }

        .vf-corner {
            position: absolute;
            width: 22px;
            height: 22px;
            border-color: var(--cyan);
            border-style: solid;
        }

        .vf-corner.tl { top: 0; left: 0; border-width: 2.5px 0 0 2.5px; border-radius: 4px 0 0 0; }
        .vf-corner.tr { top: 0; right: 0; border-width: 2.5px 2.5px 0 0; border-radius: 0 4px 0 0; }
        .vf-corner.bl { bottom: 0; left: 0; border-width: 0 0 2.5px 2.5px; border-radius: 0 0 0 4px; }
        .vf-corner.br { bottom: 0; right: 0; border-width: 0 2.5px 2.5px 0; border-radius: 0 0 4px 0; }

        .vf-scan-line {
            position: absolute;
            left: 4px;
            right: 4px;
            height: 1.5px;
            background: linear-gradient(90deg, transparent, var(--cyan), transparent);
            animation: scanLine 2s infinite ease-in-out;
            top: 0;
        }

        @keyframes scanLine {
            0% { top: 4px; opacity: 1; }
            90% { top: calc(100% - 4px); opacity: 1; }
            100% { top: calc(100% - 4px); opacity: 0; }
        }

        .vf-bg {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.45);
        }

        .vf-window {
            position: absolute;
            inset: 0;
            clip-path: polygon(
                0% 0%, 100% 0%, 100% 100%, 0% 100%,
                0% 17.5%, 17.5% 17.5%, 17.5% 82.5%, 82.5% 82.5%, 82.5% 17.5%, 17.5% 17.5%,
                0% 17.5%
            );
        }

        /* Live indicator */
        .live-badge {
            position: absolute;
            top: 12px;
            left: 12px;
            display: flex;
            align-items: center;
            gap: 5px;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 4px 10px;
            font-size: 10px;
            font-weight: 700;
            color: var(--red);
            letter-spacing: 0.5px;
        }

        .live-dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: var(--red);
            animation: blink 1s infinite;
        }

        /* Frame counter */
        .frame-badge {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 8px;
            padding: 4px 8px;
            font-size: 9px;
            font-family: 'SF Mono', 'Fira Code', monospace;
            color: var(--text-dim);
        }

        /* ── Idle state ── */
        .idle-section {
            padding: 36px 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .idle-icon-wrap {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: var(--cyan-dim);
            border: 1px solid rgba(0,212,255,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            animation: idlePulse 3s infinite ease-in-out;
        }

        @keyframes idlePulse {
            0%, 100% { box-shadow: 0 0 0 0 var(--cyan-glow); }
            50% { box-shadow: 0 0 0 16px transparent; }
        }

        .idle-text {
            text-align: center;
        }

        .idle-title {
            font-size: 17px;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 6px;
        }

        .idle-subtitle {
            font-size: 13px;
            color: var(--text-dim);
            line-height: 1.5;
        }

        /* ── Scan button ── */
        .scan-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: calc(100% - 32px);
            margin: 0 16px 20px;
            padding: 16px;
            background: linear-gradient(135deg, #00d4ff, #0066ee);
            border: none;
            border-radius: 16px;
            color: #fff;
            font-size: 16px;
            font-weight: 800;
            letter-spacing: 0.3px;
            cursor: pointer;
            box-shadow: 0 6px 24px rgba(0,212,255,0.3);
            transition: transform 0.15s, box-shadow 0.15s;
            -webkit-appearance: none;
            position: relative;
            overflow: hidden;
        }

        .scan-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(255,255,255,0.12) 0%, transparent 50%);
            pointer-events: none;
        }

        .scan-btn:active {
            transform: scale(0.97);
            box-shadow: 0 2px 12px rgba(0,212,255,0.2);
        }

        .scan-btn.hidden { display: none; }

        .btn-icon { font-size: 20px; }

        /* ── Result card ── */
        .result-card {
            width: 100%;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 24px;
            overflow: hidden;
        }

        .result-inner {
            padding: 24px 20px;
            text-align: center;
        }

        .result-label {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--text-dim);
            margin-bottom: 12px;
        }

        .code-wrap {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin-bottom: 14px;
        }

        .code-group {
            font-family: 'SF Mono', 'Fira Code', 'Courier New', monospace;
            font-size: 38px;
            font-weight: 900;
            letter-spacing: 4px;
            color: var(--cyan);
            background: rgba(0,212,255,0.06);
            border: 1px solid rgba(0,212,255,0.15);
            border-radius: 12px;
            padding: 10px 16px;
            min-width: 100px;
            transition: all 0.3s;
        }

        .code-sep {
            font-size: 28px;
            font-weight: 300;
            color: var(--text-muted);
        }

        .code-group.stop-mode { color: var(--red); background: rgba(255,71,87,0.06); border-color: rgba(255,71,87,0.15); }

        .result-status {
            font-size: 13px;
            color: var(--text-dim);
            line-height: 1.5;
        }

        .result-status.success {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            color: var(--green);
            font-weight: 700;
        }

        /* ── Log panel ── */
        .log-panel {
            width: 100%;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
        }

        .log-header {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 10px 14px;
            border-bottom: 1px solid var(--border);
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--text-dim);
        }

        .log-header span.dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--cyan);
            opacity: 0.6;
        }

        .log-body {
            padding: 10px 14px;
            font-size: 10.5px;
            font-family: 'SF Mono', 'Fira Code', 'Courier New', monospace;
            color: var(--text-dim);
            max-height: 100px;
            overflow-y: auto;
            line-height: 1.8;
            scrollbar-width: none;
        }

        .log-body::-webkit-scrollbar { display: none; }

        .log-line.ok { color: var(--green); }
        .log-line.err { color: var(--red); }
        .log-line.info { color: var(--cyan); }
        .log-line.dim { color: var(--text-muted); }

        /* ── Footer instructions ── */
        .instructions {
            width: 100%;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .step {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 14px 10px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .step-num {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: var(--cyan-dim);
            border: 1px solid rgba(0,212,255,0.2);
            font-size: 11px;
            font-weight: 800;
            color: var(--cyan);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .step-text {
            font-size: 10px;
            color: var(--text-dim);
            line-height: 1.4;
        }

        /* ── Responsive tweaks ── */
        @media (max-width: 360px) {
            .code-group { font-size: 30px; padding: 8px 12px; min-width: 80px; }
            .idle-icon-wrap { width: 64px; height: 64px; font-size: 28px; }
        }

        @media (min-width: 480px) {
            .page-content { padding: 24px 24px 32px; }
        }

        /* Success animation */
        @keyframes successPop {
            0% { transform: scale(0.8); opacity: 0; }
            60% { transform: scale(1.05); }
            100% { transform: scale(1); opacity: 1; }
        }

        .animate-pop {
            animation: successPop 0.4s ease forwards;
        }

        canvas { display: none; }
    </style>
</head>
<body>
<div class="page-content">

    <!-- Header -->
    <header class="app-header">
        <div class="brand">
            <div class="brand-icon">🍊</div>
            <div class="brand-text">
                <div class="brand-name">MANDARIN</div>
                <div class="brand-sub">AUTHENTICATOR</div>
            </div>
        </div>
        <div class="status-pill">
            <div class="status-dot"></div>
            OFFLINE
        </div>
    </header>

    <!-- Main scan card -->
    <div class="scan-card" id="scanCard">

        <!-- Video scanner (hidden until active) -->
        <div class="video-section" id="videoSection">
            <video id="webcamVideo" playsinline webkit-playsinline autoplay muted></video>
            <canvas id="scanCanvas"></canvas>

            <div class="vf-bg"></div>
            <div class="vf-overlay">
                <div class="vf-frame">
                    <div class="vf-scan-line"></div>
                    <div class="vf-corner tl"></div>
                    <div class="vf-corner tr"></div>
                    <div class="vf-corner bl"></div>
                    <div class="vf-corner br"></div>
                </div>
            </div>

            <div class="live-badge">
                <div class="live-dot"></div>
                LIVE
            </div>
            <div class="frame-badge" id="frameBadge">0 fps</div>
        </div>

        <!-- Idle state -->
        <div class="idle-section" id="idleSection">
            <div class="idle-icon-wrap">📷</div>
            <div class="idle-text">
                <div class="idle-title">Scan QR Code</div>
                <div class="idle-subtitle">Point your camera at the QR code displayed on your PC screen</div>
            </div>
        </div>

        <!-- Scan button -->
        <button class="scan-btn" id="btnScan" onclick="startLiveCamera()">
            <span class="btn-icon">📷</span>
            <span id="btnText">Open Scanner</span>
        </button>
    </div>

    <!-- Result card -->
    <div class="result-card">
        <div class="result-inner">
            <div class="result-label" id="resultLabel">Response PIN</div>
            <div class="code-wrap">
                <div class="code-group" id="codeA">---</div>
                <div class="code-sep">-</div>
                <div class="code-group" id="codeB">---</div>
            </div>
            <div class="result-status" id="resultStatus">Awaiting scan…</div>
        </div>
    </div>

    <!-- Log panel -->
    <div class="log-panel">
        <div class="log-header">
            <span class="dot"></span>
            System Log
        </div>
        <div class="log-body" id="logBody">
            <div class="log-line dim">▶ System initializing…</div>
        </div>
    </div>

    <!-- Steps -->
    <div class="instructions">
        <div class="step">
            <div class="step-num">1</div>
            <div class="step-text">Tap Open Scanner</div>
        </div>
        <div class="step">
            <div class="step-num">2</div>
            <div class="step-text">Point at PC QR code</div>
        </div>
        <div class="step">
            <div class="step-num">3</div>
            <div class="step-text">Enter PIN on PC</div>
        </div>
    </div>

</div>

<script>
    const SECRET_KEY = "MANDARIN_AIRGAPPED_MASTER_SECRET_2026";
    let mediaStream = null;
    let scanInterval = null;
    let frameCount = 0;
    let lastFrameTime = Date.now();

    function log(msg, type = '') {
        const lb = document.getElementById('logBody');
        const line = document.createElement('div');
        line.className = 'log-line ' + type;
        line.textContent = msg;
        lb.appendChild(line);
        lb.scrollTop = lb.scrollHeight;
    }

    window.addEventListener('load', function() {
        if (typeof jsQR === 'function') {
            log('✅ jsQR engine loaded', 'ok');
        } else {
            log('❌ jsQR engine failed', 'err');
        }
    });

    function generateAlphanumericCode(key, message) {
        const combined = key + ":" + message;
        const charset = "0123456789ABCDEFGHJKLMNPQRSTUVWXYZ";
        let h1 = 5381, h2 = 5381;
        for (let i = 0; i < combined.length; i++) {
            const c = combined.charCodeAt(i);
            h1 = ((h1 << 5) + h1) ^ c; h1 |= 0;
            h2 = ((h2 << 5) + h2) ^ (c * 31 | 0); h2 |= 0;
        }
        let v1 = Math.abs(h1), v2 = Math.abs(h2);
        let code = "";
        for (let i = 0; i < 3; i++) { code += charset[v1 % 34]; v1 = Math.floor(v1 / 34); }
        for (let i = 0; i < 3; i++) { code += charset[v2 % 34]; v2 = Math.floor(v2 / 34); }
        return code;
    }

    function startLiveCamera() {
        document.getElementById('btnScan').classList.add('hidden');
        document.getElementById('idleSection').style.display = 'none';
        document.getElementById('videoSection').classList.add('active');
        document.getElementById('resultStatus').textContent = 'Scanning…';
        log('▶ Opening camera…', 'info');

        if (typeof jsQR !== 'function') {
            log('❌ jsQR not available', 'err');
            resetToIdle();
            return;
        }

        navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
            .catch(() => navigator.mediaDevices.getUserMedia({ video: true }))
            .then(function(stream) {
                mediaStream = stream;
                const video = document.getElementById('webcamVideo');
                video.srcObject = stream;
                video.play();
                frameCount = 0;
                lastFrameTime = Date.now();
                log('✅ Camera active', 'ok');
                scanInterval = setInterval(processFrame, 80);
            })
            .catch(function(err) {
                log('❌ Camera: ' + err.message, 'err');
                resetToIdle();
            });
    }

    function processFrame() {
        const video = document.getElementById('webcamVideo');
        const canvas = document.getElementById('scanCanvas');
        if (!video || video.readyState !== video.HAVE_ENOUGH_DATA || !video.videoWidth) return;

        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0);
        const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);

        frameCount++;
        const now = Date.now();
        if (now - lastFrameTime >= 1000) {
            document.getElementById('frameBadge').textContent = frameCount + ' frames';
            lastFrameTime = now;
        }

        const result = jsQR(imgData.data, imgData.width, imgData.height, { inversionAttempts: "attemptBoth" });
        if (result && result.data) {
            log('🎯 QR: ' + result.data.substring(0, 30), 'info');
            stopCamera();
            handleQR(result.data);
        }
    }

    function stopCamera() {
        clearInterval(scanInterval); scanInterval = null;
        if (mediaStream) { mediaStream.getTracks().forEach(t => t.stop()); mediaStream = null; }
        document.getElementById('videoSection').classList.remove('active');
    }

    function resetToIdle() {
        stopCamera();
        document.getElementById('idleSection').style.display = 'flex';
        const btn = document.getElementById('btnScan');
        btn.classList.remove('hidden');
        document.getElementById('btnText').textContent = 'Open Scanner';
    }

    function handleQR(payload) {
        const parts = payload.split(':');
        let mode = 'DEV';
        let windowTime = Math.floor(Date.now() / 1000 / 30);

        for (let i = 0; i < parts.length; i++) {
            if (parts[i] === 'DEV' || parts[i] === 'STOP') {
                mode = parts[i];
                if (parts[i+1] && !isNaN(parts[i+1])) windowTime = parseInt(parts[i+1]);
                break;
            }
        }

        const code = generateAlphanumericCode(SECRET_KEY, mode + ":" + windowTime);
        const isStop = mode === 'STOP';

        const codeA = document.getElementById('codeA');
        const codeB = document.getElementById('codeB');
        codeA.textContent = code.substring(0, 3);
        codeB.textContent = code.substring(3);
        codeA.className = 'code-group animate-pop' + (isStop ? ' stop-mode' : '');
        codeB.className = 'code-group animate-pop' + (isStop ? ' stop-mode' : '');

        document.getElementById('resultLabel').textContent = isStop ? '🔴 Shutdown PIN' : '🔵 Developer PIN';

        const status = document.getElementById('resultStatus');
        status.className = 'result-status success';
        status.innerHTML = '<span>✅</span><span>Enter this PIN on your PC</span>';

        log('✅ PIN: ' + code.substring(0,3) + '-' + code.substring(3), 'ok');

        // Reset scan button
        document.getElementById('idleSection').style.display = 'flex';
        const btn = document.getElementById('btnScan');
        btn.classList.remove('hidden');
        document.getElementById('btnText').textContent = 'Scan Again';
    }
</script>
</body>
</html>
